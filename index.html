<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UmbraForge</title>
<style>
  :root { --umbra:#08060b; --surface:#141018; --ember:#ff7a00; --text:#f4f1f6; --muted:#a49fae; }
  body { margin:0; background:var(--umbra); color:var(--text); min-height:100vh;
    display:grid; place-items:center; text-align:center;
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .mark { width:64px; height:64px; border-radius:16px; background:var(--ember); margin:0 auto 18px;
    display:grid; place-items:center; color:var(--umbra); font-size:34px; }
  h1 { font-size:28px; margin:0 0 6px; letter-spacing:.3px; }
  p { color:var(--muted); margin:0 0 22px; }
  a { color:var(--ember); text-decoration:none; border:1px solid #2c2338;
    border-radius:999px; padding:9px 18px; display:inline-block; }
</style>
</head>
<body>
  <main>
    <div class="mark">&hearts;</div>
    <h1>UmbraForge</h1>
    <p>Independent app studio.</p>
    <a href="/duetflix/site/">DuetFlix</a>
  </main>
</body>
</html>
